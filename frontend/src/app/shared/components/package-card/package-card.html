<article class="package-card">
  <img class="package-card__image" [src]="cateringPackage().imageUrl" [alt]="cateringPackage().name + ' catering setup'" loading="lazy" />
  <div class="package-card__body">
    <div>
      <p class="package-card__category">{{ cateringPackage().category }} catering</p>
      <h3>{{ cateringPackage().name }}</h3>
      <p class="package-card__description">{{ cateringPackage().description }}</p>
    </div>
    <p class="package-card__price">{{ priceLabel() }}</p>
    @if (cateringPackage().minGuests !== null && cateringPackage().maxGuests !== null) {
      <p class="package-card__capacity">{{ cateringPackage().minGuests }}-{{ cateringPackage().maxGuests }} guests</p>
    }
    <button class="btn btn-tertiary package-card__details" data-testid="view-package" type="button" (click)="openPackage()">View package <span aria-hidden="true">&rarr;</span></button>
  </div>
</article>
