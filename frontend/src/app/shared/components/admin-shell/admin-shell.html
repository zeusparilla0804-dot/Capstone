<main class="admin-layout portal-surface">
  <app-dashboard-sidebar
    brandAppearance="editorial"
    [title]="auth.user()?.fullName ?? 'Administrator'"
    subtitle="Administrator"
    [navItems]="nav()"
    (navAction)="action($event)"
  />
  <section class="admin-main">
    @if (auth.idleWarning()) {
      <div class="admin-session-warning" role="status">
        <span>Your session will expire in less than a minute due to inactivity.</span>
        <button class="btn btn-ghost" type="button" [disabled]="renewingSession()" (click)="staySignedIn()">
          {{ renewingSession() ? 'Renewing session…' : 'Stay signed in' }}
        </button>
      </div>
    }
    @if (sessionError()) {
      <p class="admin-session-error" role="alert">{{ sessionError() }}</p>
    }
    <header class="admin-page-header">
      <div><p class="page-kicker">LA Chef administration</p><h1>{{title()}}</h1><p>{{description()}}</p></div>
      <ng-content select="[admin-actions]"/>
    </header>
    <ng-content/>
  </section>
</main>
