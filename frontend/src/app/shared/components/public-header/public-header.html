<header class="public-header" [class.public-header--auth]="appearance() === 'auth'">
  <div class="public-header__inner">
    <a class="public-header__brand" routerLink="/" aria-label="LA Chef home" (click)="closeMenu()">
      <span class="public-header__brand-name"
        ><span class="public-header__brand-accent">LA</span><strong>Chef</strong></span
      >
      <small class="public-header__brand-tagline">Event Catering Services</small>
    </a>

    <button
      class="public-header__toggle"
      type="button"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="public-navigation"
      [attr.aria-label]="isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <nav
      id="public-navigation"
      class="public-header__nav"
      [class.is-open]="isMenuOpen()"
      aria-label="Main navigation"
    >
      <ul class="public-header__links">
        @for (item of navItems; track item.label) {
          <li>
            @if (item.showActiveState === false) {
              <a [routerLink]="item.route" (click)="closeMenu()">{{ item.label }}</a>
            } @else {
              <a
                [routerLink]="item.route"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: item.route === '/' }"
                (click)="closeMenu()"
                >{{ item.label }}</a
              >
            }
          </li>
        }
      </ul>

      <div class="public-header__actions">
        @if (authenticated()) {
          <div #accountArea class="public-header__account" (keydown)="onAccountKeydown($event)" (focusout)="onAccountFocusOut($event)">
            <button #accountTrigger class="public-header__account-trigger" type="button" [attr.aria-expanded]="isAccountOpen()" aria-controls="customer-account-menu" [attr.aria-label]="'Account for ' + (auth.user()?.fullName ?? 'Customer')" (click)="toggleAccount()">
              <span class="public-header__account-avatar" aria-hidden="true">{{ customerInitials() }}</span>
              <span class="public-header__account-copy"><strong [title]="auth.user()?.fullName ?? 'Customer'">{{ auth.user()?.fullName ?? 'Customer' }}</strong><small>Customer</small></span>
              <svg class="public-header__account-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            @if (isAccountOpen()) {
              <nav id="customer-account-menu" class="public-header__account-menu" aria-label="Customer account">
                <a routerLink="/dashboard" (click)="closeMenu()">Dashboard</a>
                <a routerLink="/profile" (click)="closeMenu()">My Profile</a>
                <button type="button" [disabled]="signingOut()" (click)="logout()">Logout</button>
              </nav>
            }
          </div>
        } @else {
          <a class="public-header__login" routerLink="/login" (click)="closeMenu()">Log in</a>
        }
        <a
          class="public-header__auth btn btn-primary btn-sm"
          routerLink="/book-event" [queryParams]="{ new: 1 }"
          routerLinkActive
          #bookingLink="routerLinkActive"
          [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
          [style.visibility]="bookingLink.isActive ? 'hidden' : null"
          (click)="closeMenu()"
          >Book now</a
        >
      </div>
    </nav>
    <button
      class="public-header__backdrop"
      [class.is-open]="isMenuOpen()"
      type="button"
      aria-label="Close navigation menu"
      (click)="closeMenu()"
    ></button>
  </div>
</header>
