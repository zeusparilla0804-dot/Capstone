<div class="booking-menu">
  <div class="booking-menu__fields">
    @for (field of definition().fields; track field.key) {
      <div class="form-field">
        <label [for]="'menu-' + field.key">{{ field.label }} *</label>
        <select [id]="'menu-' + field.key" required
          [attr.aria-invalid]="!!error(field)" [attr.aria-describedby]="'menu-error-' + field.key"
          (change)="edit(field, $event)" (blur)="markEdited(field.key)">
          <option value="" [selected]="!values()[field.key]" disabled>Choose an option</option>
          @for (option of choices(field); track option) {
            <option [value]="option" [selected]="values()[field.key] === option">{{ option }}</option>
          }
        </select>
        <small [id]="'menu-error-' + field.key" class="booking-menu__feedback" aria-live="polite">{{ error(field) }}</small>
      </div>
    }
  </div>
  <p class="booking-menu__included"><strong>Also included</strong> {{ definition().includedItems.join(' · ') }}</p>
</div>
