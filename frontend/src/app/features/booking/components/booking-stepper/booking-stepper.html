<nav class="stepper" aria-label="Reservation progress">
  <p class="stepper__mobile">Step {{ currentStep() }} of {{ steps.length }} <strong>{{ steps[currentStep() - 1] }}</strong></p>
  <ol>
    @for (step of steps; track step; let stepIndex = $index) {
      <li [class.is-current]="currentStep() === stepIndex + 1" [class.is-complete]="currentStep() > stepIndex + 1" [attr.aria-current]="currentStep() === stepIndex + 1 ? 'step' : null">
        <span>{{ currentStep() > stepIndex + 1 ? '&#10003;' : stepIndex + 1 }}</span>
        <strong>{{ step }}</strong>
      </li>
    }
  </ol>
</nav>
